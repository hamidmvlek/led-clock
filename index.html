<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>time</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #000000;
    /* big digit height; the time row is a fraction of it */
    --H: min(40vh, calc((100vw - 32px) * 0.29), 260px);
    --h: calc(var(--H) * 0.4);
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    touch-action: none;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 16px;
    box-sizing: border-box;
  }
  .panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: calc(var(--H) * 0.22);
  }
  .row {
    display: flex;
    align-items: center;
  }
  .row svg {
    display: block;
    overflow: visible;
  }
  .days {
    gap: calc(var(--H) * 0.05);
  }
  .days .digit {
    height: var(--H);
    width: calc(var(--H) * 0.76);
  }
  .time {
    gap: calc(var(--h) * 0.06);
  }
  .time .digit {
    height: var(--h);
    width: calc(var(--h) * 0.76);
  }
  .time .colon {
    height: var(--h);
    width: calc(var(--h) * 0.24);
  }
  .ghost {
    fill: #1a0201;
  }
  .glow {
    fill: #d60c06;
  }
  .lit {
    fill: url(#lit);
  }
  .core {
    fill: url(#hot);
  }
  .off {
    display: none;
  }
  .grain {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.03;
    mix-blend-mode: screen;
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position: absolute" aria-hidden="true">
  <defs>
    <!-- sampled from the reference: coral segment edges, amber hot cores,
         warmer toward the top of each digit -->
    <linearGradient id="lit" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="100">
      <stop offset="0" stop-color="#fa6a38"></stop>
      <stop offset="1" stop-color="#f2553e"></stop>
    </linearGradient>
    <linearGradient id="hot" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="100">
      <stop offset="0" stop-color="#feac29"></stop>
      <stop offset="0.5" stop-color="#fd9e26"></stop>
      <stop offset="1" stop-color="#fd872f"></stop>
    </linearGradient>
    <!-- blurred amber kept inside the segment: bright center fading to coral edges -->
    <filter id="core" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.4" result="b"></feGaussianBlur>
      <feComposite in="b" in2="SourceAlpha" operator="in"></feComposite>
    </filter>
    <filter id="halo" filterUnits="userSpaceOnUse" x="-40" y="-40" width="160" height="180">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="near"></feGaussianBlur>
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="far"></feGaussianBlur>
      <feComponentTransfer in="near" result="nearA">
        <feFuncA type="linear" slope="1"></feFuncA>
      </feComponentTransfer>
      <feComponentTransfer in="far" result="farA">
        <feFuncA type="linear" slope="0.9"></feFuncA>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="farA"></feMergeNode>
        <feMergeNode in="nearA"></feMergeNode>
      </feMerge>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.35"></feGaussianBlur>
    </filter>
  </defs>
</svg>

<div class="panel">
  <div class="row days" id="days"></div>
  <div class="row time" id="time"></div>
</div>

<svg class="grain" width="100%" height="100%" aria-hidden="true">
  <filter id="noise">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"></feTurbulence>
    <feColorMatrix values="1 0 0 0 0  0 0.2 0 0 0  0 0 0.2 0 0  0 0 0 1 0"></feColorMatrix>
  </filter>
  <rect width="100%" height="100%" filter="url(#noise)"></rect>
</svg>

<script>
  // Start moment (local time).
  const START = new Date(2026, 9, 21, 23, 51, 0);

  const KEY = 'last-day-seen';
  const NS = 'http://www.w3.org/2000/svg';

  // Seven-segment geometry on a 60 x 100 grid, slanted 7.5deg like the reference.
  const T = 11;      // segment thickness
  const G = 1.4;     // gap at segment joints
  const L = 6.5, R = 53.5, TOP = 6.5, MID = 50, BOT = 93.5;
  const SLANT = 'translate(6.6 0) skewX(-7.5)';

  const pts = list => list.map(p => p.map(n => +n.toFixed(2)).join(',')).join(' ');
  const hSeg = (x1, x2, y) => pts([
    [x1 + G, y], [x1 + G + T / 2, y - T / 2], [x2 - G - T / 2, y - T / 2],
    [x2 - G, y], [x2 - G - T / 2, y + T / 2], [x1 + G + T / 2, y + T / 2],
  ]);
  const vSeg = (x, y1, y2) => pts([
    [x, y1 + G], [x + T / 2, y1 + G + T / 2], [x + T / 2, y2 - G - T / 2],
    [x, y2 - G], [x - T / 2, y2 - G - T / 2], [x - T / 2, y1 + G + T / 2],
  ]);

  const SHAPES = {
    a: hSeg(L, R, TOP),
    b: vSeg(R, TOP, MID),
    c: vSeg(R, MID, BOT),
    d: hSeg(L, R, BOT),
    e: vSeg(L, MID, BOT),
    f: vSeg(L, TOP, MID),
    g: hSeg(L, R, MID),
  };

  const GLYPHS = {
    0: 'abcdef', 1: 'bc', 2: 'abdeg', 3: 'abcdg', 4: 'bcfg',
    5: 'acdfg', 6: 'acdefg', 7: 'abc', 8: 'abcdefg', 9: 'abcdfg',
    A: 'abcefg', b: 'cdefg', d: 'bcdeg', E: 'adefg', G: 'acdef',
    H: 'bcefg', L: 'def', n: 'ceg', o: 'cdeg', P: 'abefg', r: 'eg',
    S: 'acdfg', t: 'defg', U: 'bcdef', u: 'cde', Y: 'bcdfg', ' ': '',
  };

  // Real LED segments are never perfectly even: fixed small brightness differences.
  let seed = 7;
  const jitter = () => {
    seed = (seed * 16807) % 2147483647;
    return 0.9 + (seed / 2147483647) * 0.1;
  };

  function el(name, attrs, parent) {
    const node = document.createElementNS(NS, name);
    for (const k in attrs) node.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(node);
    return node;
  }

  // Each element has four layers: dark ghost, red halo, coral face, amber hot core.
  function layered(svg, shapes) {
    const root = el('g', { transform: SLANT }, svg);
    const ghost = el('g', {}, root);
    const glow = el('g', { filter: 'url(#halo)' }, root);
    const face = el('g', { filter: 'url(#soft)' }, root);
    const parts = {};
    for (const key in shapes) {
      const [tag, attrs] = shapes[key];
      const level = jitter().toFixed(3);
      el(tag, { ...attrs, class: 'ghost' }, ghost);
      parts[key] = [
        el(tag, { ...attrs, class: 'glow off', opacity: level }, glow),
        el(tag, { ...attrs, class: 'lit off' }, face),
        el(tag, { ...attrs, class: 'core off', filter: 'url(#core)', opacity: level }, face),
      ];
    }
    return parts;
  }

  function setParts(item, on) {
    if (item.on === on) return;
    item.on = on;
    for (const key in item.parts) {
      const lit = on.includes(key);
      for (const node of item.parts[key]) node.classList.toggle('off', !lit);
    }
  }

  function makeDigit(row) {
    const svg = el('svg', { viewBox: '-8 0 76 100', class: 'digit' });
    row.appendChild(svg);
    const shapes = {};
    for (const key in SHAPES) shapes[key] = ['polygon', { points: SHAPES[key] }];
    return { parts: layered(svg, shapes), on: null };
  }

  function makeColon(row) {
    const svg = el('svg', { viewBox: '-6 0 24 100', class: 'colon' });
    row.appendChild(svg);
    const dot = y => ['rect', { x: 0.5, y, width: 11, height: 11, rx: 1.5 }];
    return { parts: layered(svg, { u: dot(26), l: dot(63) }), on: null };
  }

  const dayRow = document.getElementById('days');
  const timeRow = document.getElementById('time');
  const dayCells = Array.from({ length: 4 }, () => makeDigit(dayRow));
  const timeCells = [];
  const colons = [];
  for (let i = 0; i < 3; i++) {
    if (i > 0) colons.push(makeColon(timeRow));
    timeCells.push(makeDigit(timeRow), makeDigit(timeRow));
  }
  const allCells = [...dayCells, ...timeCells];

  const glyph = ch => GLYPHS[ch] ?? '';
  const showText = (cells, text) => cells.forEach((c, i) => setParts(c, glyph(text[i] ?? ' ')));
  const showColons = on => colons.forEach(c => setParts(c, on ? 'ul' : ''));

  function loadSeenDay() {
    try {
      const raw = localStorage.getItem(KEY);
      return raw === null ? 0 : Number(raw) || 0;
    } catch {
      return 0;
    }
  }

  function saveSeenDay(day) {
    try {
      localStorage.setItem(KEY, String(day));
    } catch {
      // storage blocked: the celebration may replay on reload, nothing else breaks
    }
  }

  // Celebration: a segment chase, a lamp test, then the new day count
  // blinks while the small row shows a message matched to the milestone.
  const CHASE_MS = 1800;
  const LAMP_MS = 600;
  const CELEBRATE_MS = 11000;
  const CHASE = ['a', 'b', 'c', 'd', 'e', 'f'];

  function messageFor(days) {
    if (days % 365 === 0) return 'LEGEnd';
    if (days % 30 === 0) return ' Proud';
    if (days % 7 === 0) return 'StronG';
    return 'HUrrAY';
  }

  let seenDay = loadSeenDay();
  let celebration = null;

  function daysText(days) {
    return String(days).slice(-4).padStart(4, ' ');
  }

  function drawCelebration(now, days) {
    const t = now - celebration.start;
    if (t < CHASE_MS) {
      const step = Math.floor(t / 70);
      allCells.forEach((cell, i) => {
        const k = (step + i) % 6;
        setParts(cell, CHASE[k] + CHASE[(k + 5) % 6]);
      });
      showColons(false);
    } else if (t < CHASE_MS + LAMP_MS) {
      allCells.forEach(cell => setParts(cell, GLYPHS[8]));
      showColons(true);
    } else {
      const blinkOn = (t - CHASE_MS - LAMP_MS) % 700 < 450;
      showText(dayCells, blinkOn ? daysText(days) : '    ');
      showText(timeCells, celebration.message);
      showColons(false);
    }
  }

  function frame() {
    const now = Date.now();
    const elapsed = Math.max(0, now - START.getTime());
    const days = Math.floor(elapsed / 864e5);
    const hours = Math.floor(elapsed / 36e5) % 24;
    const minutes = Math.floor(elapsed / 6e4) % 60;
    const seconds = Math.floor(elapsed / 1e3) % 60;

    if (days > seenDay) {
      seenDay = days;
      saveSeenDay(days);
      celebration = { start: now, message: messageFor(days) };
    }

    if (celebration && now - celebration.start < CELEBRATE_MS) {
      drawCelebration(now, days);
      return;
    }
    celebration = null;

    showText(dayCells, daysText(days));
    showText(timeCells, [hours, minutes, seconds].map(n => String(n).padStart(2, '0')).join(''));
    showColons(now % 1000 < 500);
  }

  // No zooming: pinch, double-tap, ctrl/cmd + wheel, ctrl/cmd + plus/minus/0.
  // iOS Safari ignores user-scalable=no, so its gesture events are blocked too.
  const block = e => e.preventDefault();
  const opts = { passive: false };
  ['gesturestart', 'gesturechange', 'gestureend', 'dblclick'].forEach(type =>
    document.addEventListener(type, block, opts));
  document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, opts);
  document.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, opts);
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && ['+', '=', '-', '_', '0'].includes(e.key)) e.preventDefault();
  });

  frame();
  setInterval(frame, 50);
</script>
</body>
</html>
